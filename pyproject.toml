[project]
name = "asternavium"
version = "0.1.0"
description = "Modular platform for astrology, numerology and traditional knowledge systems."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio>=4.15.1",
    "boto3>=1.43.123",
    "fastapi>=0.159.1",
    "pydantic-settings>=2.16.1",
    "python-ulid>=4.1.0",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "ASYNC", "S", "PT", "RET", "PTH", "TID", "TC", "DTZ", "LOG", "G", "T20", "D",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "D107",  # __init__ is documented in the class docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tools"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the developer tools in tools/.
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "--cov=app", "--cov-report=term-missing"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb]>=1.43.123",
    "httpx2>=2.16.0",
    "hypothesis>=6.170.14",
    "moto[dynamodb]>=5.2.5",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
