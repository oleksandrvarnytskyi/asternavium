# Hooks run the project's locked tool versions through uv, so there is nothing to pin here.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: spdx-header
        name: SPDX licence header
        entry: "SPDX-License-Identifier: AGPL-3.0-or-later"
        language: pygrep
        args: [--negate]
        types: [python]
